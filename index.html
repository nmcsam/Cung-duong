<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#5C3D00" id="theme-color"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Bố Thí · Giới · Thiền"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-lion2-192.png">
<link rel="icon" type="image/png" href="icon-lion2-192.png">
<title>Bố Thí · Giữ Giới · Hành Thiền</title>
<style>
/* App chung: 2 trình đơn — Bố thí (app Cúng dường) và Giữ giới - Hành thiền (app Meditation).
   Mỗi app chạy nguyên vẹn trong khung riêng (cùng tên miền nmcsam.github.io). */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:#FFF8E7;font-family:-apple-system,'Segoe UI',Arial,sans-serif;}
#top{flex-shrink:0;padding:calc(6px + env(safe-area-inset-top)) 10px 8px;text-align:center;transition:background .25s;
  background:linear-gradient(135deg,#5C3D00,#8B6914 60%,#A07828);box-shadow:0 3px 12px rgba(0,0,0,.25);position:relative;z-index:2;}
body.thien #top{background:linear-gradient(135deg,#0b3d35,#076d5e 60%,#0e7f6e);}
#title{font-family:'Noto Serif','Times New Roman',Times,serif;font-weight:800;color:#FFF8E7;letter-spacing:.06em;font-size:clamp(14px,4.3vw,22px);line-height:1.2;}
#title .dot{color:#EDD98A;margin:0 .25em;}
body.thien #title .dot{color:#9fe0d2;}
#menu{display:flex;gap:6px;margin:7px auto 0;max-width:620px;}
#menu button{flex:1;padding:8px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);color:#F3E6C0;
  font-size:clamp(13px,3.6vw,15px);font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.15;}
#menu button .ic{font-size:1.25em;}
#menu button.on{color:#fff;border-color:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.35) inset;}
#menu #m-bothi.on{background:linear-gradient(180deg,#C9A54A,#8B6914);}
#menu #m-thien.on{background:linear-gradient(180deg,#14a08a,#076d5e);}
#frames{flex:1;min-height:0;position:relative;}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff;}
#frames iframe.on{display:block;}
/* Màn hình ngang & thấp: gộp tiêu đề và trình đơn vào một hàng cho đỡ tốn chỗ */
@media (orientation:landscape) and (min-width:680px){
  #top{display:flex;align-items:center;gap:14px;padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:5px;}
  #title{text-align:left;white-space:nowrap;font-size:clamp(14px,1.8vw,20px);}
  #menu{margin:0 0 0 auto;max-width:520px;flex:1;}
  #menu button{padding:6px;}
}
</style>
</head>
<body>
<div id="top">
  <div id="title">BỐ THÍ<span class="dot">·</span>GIỮ GIỚI<span class="dot">·</span>HÀNH THIỀN</div>
  <div id="menu">
    <button id="m-bothi" onclick="go('bothi')"><span class="ic">🪷</span>Bố thí</button>
    <button id="m-thien" onclick="go('thien')"><span class="ic">🧘</span>Giữ giới - Hành thiền</button>
  </div>
</div>
<div id="frames">
  <iframe id="f-bothi" title="Bố thí" data-src="bothi.html"></iframe>
  <iframe id="f-thien" title="Giữ giới - Hành thiền" data-src="../Meditation/" allow="autoplay; wake-lock; screen-wake-lock"></iframe>
</div>
<script>
// Chỉ tải mỗi app khi mở lần đầu; sau đó giữ nguyên (không mất trạng thái khi chuyển qua lại)
function go(k){
  if(k!=='bothi'&&k!=='thien') k='bothi';
  ['bothi','thien'].forEach(function(x){
    var f=document.getElementById('f-'+x), on=(x===k);
    if(on && !f.getAttribute('src')) f.setAttribute('src', f.getAttribute('data-src'));
    f.classList.toggle('on',on);
    document.getElementById('m-'+x).classList.toggle('on',on);
  });
  document.body.classList.toggle('thien',k==='thien');
  document.getElementById('theme-color').setAttribute('content',k==='thien'?'#076d5e':'#5C3D00');
  try{ localStorage.setItem('shell_tab',k); }catch(e){}
  try{ history.replaceState(null,'','#'+k); }catch(e){}
}
var start=(location.hash||'').replace('#','');
if(start!=='bothi'&&start!=='thien'){ try{ start=localStorage.getItem('shell_tab')||'bothi'; }catch(e){ start='bothi'; } }
go(start);
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
